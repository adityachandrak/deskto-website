---
- name: Deploy Deskto backend container
  hosts: webservers
  become: true
  gather_facts: true
  vars:
    project_name: deskto-website
    app_dir: /opt/{{ project_name }}
    env_file: /opt/{{ project_name }}/.env
    backend_image: "{{ lookup('env', 'BACKEND_IMAGE') | default('deskto-backend:latest', true) }}"
    region: "{{ lookup('env', 'AWS_REGION') | default('ap-south-1', true) }}"
    app_port: "{{ lookup('env', 'APP_PORT') | default('3001', true) }}"

  tasks:
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Fetch database host from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/database-host" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: db_host

    - name: Fetch database port from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/database-port" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: db_port

    - name: Fetch database name from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/database-name" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: db_name

    - name: Fetch database user from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/database-user" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: db_user

    - name: Fetch database password from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/database-password" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: db_password

    - name: Fetch JWT secret from AWS SSM
      shell: |
        aws ssm get-parameter --name "/{{ project_name }}/production/jwt-secret" --with-decryption --region {{ region }} --query 'Parameter.Value' --output text
      register: jwt_secret

    - name: Write runtime environment file
      copy:
        dest: "{{ env_file }}"
        content: |
          NODE_ENV=production
          HOST=0.0.0.0
          PORT={{ app_port }}
          DB_HOST={{ db_host.stdout | trim }}
          DB_PORT={{ db_port.stdout | trim }}
          DB_NAME={{ db_name.stdout | trim }}
          DB_USER={{ db_user.stdout | trim }}
          DB_PASSWORD={{ db_password.stdout | trim }}
          JWT_SECRET={{ jwt_secret.stdout | trim }}
          FRONTEND_URL={{ lookup('env', 'FRONTEND_URL') | default('http://localhost:5173', true) }}
        mode: '0600'

    - name: Copy compose file
      copy:
        src: /Users/adityakumar/Downloads/New Aditya 3-d Website/docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Pull latest backend image
      shell: docker pull {{ backend_image }}

    - name: Run database migrations
      shell: |
        docker run --rm \
          --network host \
          -e DB_HOST={{ db_host.stdout | trim }} \
          -e DB_PORT={{ db_port.stdout | trim }} \
          -e DB_NAME={{ db_name.stdout | trim }} \
          -e DB_USER={{ db_user.stdout | trim }} \
          -e DB_PASSWORD={{ db_password.stdout | trim }} \
          -e JWT_SECRET={{ jwt_secret.stdout | trim }} \
          -e FRONTEND_URL={{ lookup('env', 'FRONTEND_URL') | default('http://localhost:5173', true) }} \
          -e NODE_ENV=production \
          {{ backend_image }} npm run migrate
      register: migration_result

    - name: Stop existing backend container if present
      shell: docker rm -f deskto-backend >/dev/null 2>&1 || true

    - name: Start backend container
      shell: docker compose -f {{ app_dir }}/docker-compose.yml up -d backend
      environment:
        BACKEND_IMAGE: "{{ backend_image }}"
        NODE_ENV: production
        PORT: "{{ app_port }}"

    - name: Wait for backend health endpoint
      uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

    - name: Show deployment summary
      debug:
        msg: "Backend deployed and healthy on port {{ app_port }}"

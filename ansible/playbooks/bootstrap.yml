---
- name: Bootstrap EC2 instance for Deskto backend
  hosts: webservers
  become: true
  gather_facts: true

  vars:
    deploy_user: deploy

  tasks:
    - name: Update system packages
      yum:
        name: '*'
        state: latest

    - name: Install Docker prerequisites
      yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - python3-pip
        state: present

    - name: Add Docker repository
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Install Docker CE
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Install AWS CLI v2
      shell: |
        if ! command -v aws >/dev/null 2>&1; then
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
          /tmp/awscliv2/aws/install -i /usr/local/aws-cli -b /usr/local/bin
        fi
      args:
        creates: /usr/local/bin/aws

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Configure log rotation for Docker containers
      copy:
        dest: /etc/logrotate.d/docker-containers
        content: |
          /var/lib/docker/containers/*/*.log {
              rotate 7
              daily
              compress
              missingok
              notifempty
              copytruncate
          }
        mode: '0644'

    - name: Verify Docker works
      command: docker version
      register: docker_version

    - name: Print Docker version
      debug:
        msg: "{{ docker_version.stdout_lines }}"
